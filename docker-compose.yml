# Run Invest + in a container on the Orange Pi, next to the Capital +. The database is the stack
# the Capital + already runs (its deploy/postgres, installed at ~/capitalapp/db), with a database of
# its own (`invest`); this container reaches it over the external Docker network `capital-db`, which
# is also how the Capital + reaches this app's quote service (http://invest:3000/api/internal/quotes).
#
#   docker compose --env-file .env.local up -d --build     (or ./update.sh)
#
# .env.local must define (see .env.example): DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
# APP_ALLOWED_ORIGINS and the SMTP_* settings. It is passed whole to the container.
# APP_ALLOWED_ORIGINS is also baked at build time — rebuild (`up -d --build`) after changing it.
name: invest

services:
  invest:
    build:
      context: .
      args:
        APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
    image: invest:latest
    container_name: invest
    restart: unless-stopped
    ports:
      # Only the Pi itself (127.0.0.1) reaches the app: the Cloudflare tunnel is the one way in. Port
      # 3001 on the Pi, because the Capital + already has 3000. Set INVEST_BIND in .env.local if
      # cloudflared reaches the app some other way (e.g. 172.17.0.1).
      - '${INVEST_BIND:-127.0.0.1}:3001:3000'
    env_file: .env.local
    environment:
      TZ: America/Sao_Paulo
    networks: [capital-db]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  capital-db:
    external: true
